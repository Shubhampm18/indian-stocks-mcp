name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -q -m "not network"
      - run: uv build
      - name: wheel starts and keeps stdout clean
        run: uvx --from dist/*.whl indian-stocks-mcp < /dev/null
